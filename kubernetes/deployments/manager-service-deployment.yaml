apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: manager-service
  namespace: platform
spec:
  replicas: 1
  serviceName: "manager-service"
  selector:
    matchLabels:
      app: manager-service
  template:
    metadata:
      labels:
        app: manager-service
    spec:
      nodeSelector:
        role: platform
      containers:
      - name: manager-service
        image: gsiatras13/digital_platform-manager_service:a1.1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5050
        env:
        - name: WORKER_URLS
          value: "worker-a-service,worker-b-service,worker-c-service"
        - name: POSTGRES_URL
          value: "postgresql://platform:platform1234@postgres-service:5432/platform"
        # Kepler node IPs (one Kepler pod per worker node, bound via hostNetwork)
        - name: WORKER_A_NODE_IP
          value: "192.168.49.3"
        - name: WORKER_B_NODE_IP
          value: "192.168.49.4"
        - name: WORKER_C_NODE_IP
          value: "192.168.49.5"
        # Linear power model: E = cpu_time_s * (TDP_W / CPU_CORES)
        - name: CPU_TDP_W
          value: "120"
        - name: CPU_CORES
          value: "8"
        # Simulated carbon intensity per worker node (gCO2/kWh)
        - name: CARBON_A
          value: "350"
        - name: CARBON_B
          value: "600"
        - name: CARBON_C
          value: "100"
  volumeClaimTemplates:
  - metadata:
      name: manager-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 200Mi